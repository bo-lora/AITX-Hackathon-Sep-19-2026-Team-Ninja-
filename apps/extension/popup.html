<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ContextNinja</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="mark">ContextNinja</p>
      <p id="status" class="status">Idle</p>
    </header>
    <p class="lede">
      Teach a task in this Chrome window. Done sends the recording to the local
      webapp. This extension never holds an API key.
    </p>
    <div class="actions">
      <button id="create" type="button">Create skill</button>
      <button id="done" type="button" disabled>Done</button>
    </div>
    <p id="hint" class="hint"></p>
    <script src="popup.js"></script>
  </body>
</html>
